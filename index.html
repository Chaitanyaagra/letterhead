    --ink:#15303c;
    --accent:#2c6f90;
    --accent-dark:#1b4c66;
    --desk:#d6dce1;
    --panel:#ffffff;
    --app-bg:#eef1f3;
    --muted:#6a7a83;
    --line:#dbe2e7;
    --body-fs:2.35cqw;
    --lbl-fs:2.02cqw;
    --body-font:"Noto Sans Devanagari","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--app-bg);
    color:var(--ink);
    font-family:"Noto Sans Devanagari","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%;
    overscroll-behavior-y:none;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,var(--accent),var(--accent-dark));
    color:#fff;
    padding:10px 14px 9px;
    box-shadow:0 2px 10px rgba(21,48,60,.18);
  }
  .topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.2px;}
  .topbar p{margin:2px 0 0;font-size:11px;opacity:.85;font-weight:500;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky;top:52px;z-index:25;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    display:flex;gap:6px;overflow-x:auto;
    padding:8px 10px;scrollbar-width:none;
    align-items:center;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .grp{display:flex;gap:4px;align-items:center;flex:0 0 auto;
    padding-right:8px;margin-right:2px;border-right:1px solid var(--line);}
  .grp:last-child{border-right:none;}
  .tbtn{
    flex:0 0 auto;min-width:34px;height:34px;padding:0 8px;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    transition:background .12s,border-color .12s;
  }
  .tbtn:active{background:#eef4f7;}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tbtn small{font-size:10px;font-weight:600;}

  /* ---------- Stage & sheet ---------- */
  .stage{
    background:var(--desk);
    padding:14px 10px 6px;
    display:flex;justify-content:center;
  }
  .sheet{
    width:100%;max-width:560px;
    aspect-ratio:864 / 1221;
    background-image:var(--sheet-bg);
    background-size:100% 100%;
    background-repeat:no-repeat;
    position:relative;
    container-type:inline-size;
    box-shadow:0 8px 26px rgba(21,48,60,.28);
    border-radius:2px;
    overflow:hidden;
  }

  .field{
    position:absolute;
    outline:none;
    color:var(--ink);
    font-family:var(--body-font);
    line-height:1.28;
    caret-color:var(--accent);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .field:empty:before{
    content:attr(data-ph);
    color:#9aa9b1;
    pointer-events:none;
  }

  #letterNo{ left:12.8%; top:16.7%; transform:translateY(-50%);
    max-width:50%; font-size:var(--lbl-fs); white-space:nowrap; overflow:hidden;}
  #dateVal{ left:83%; top:16.7%; transform:translateY(-50%);
    max-width:15%; font-size:var(--lbl-fs); white-space:nowrap; overflow:hidden;}

  #body{
    left:6.9%; top:20.4%; width:86.2%; height:65.2%;
    font-size:var(--body-fs); line-height:1.5;
    overflow-y:auto; text-align:left;
    -webkit-user-select:text; user-select:text;
  }
  #body:before{ /* placeholder positioned at top */
    position:relative;
  }
  #body p{margin:0 0 .55em;}
  #body div{margin:0;}

  .serif #body{ --body-font:"Noto Serif Devanagari","Georgia","Times New Roman",serif; font-family:var(--body-font);}

  /* overflow hint marker */
  .overflow-warn{
    display:none;
    margin:8px 10px 0;padding:8px 12px;border-radius:10px;
    background:#fdf3e3;border:1px solid #f0d9a8;
    color:#8a5a00;font-size:12px;font-weight:600;text-align:center;
  }
  .overflow-warn.show{display:block;}

  /* ---------- Actions ---------- */
  .actions{
    position:sticky;bottom:0;z-index:20;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr 1fr;gap:9px;
  }
  .abtn{
    height:46px;border:none;border-radius:12px;font-size:14px;font-weight:700;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    font-family:inherit;
  }
  .abtn svg{width:17px;height:17px;}
  .abtn.primary{background:var(--accent);color:#fff;}
  .abtn.primary:active{background:var(--accent-dark);}
  .abtn.ghost{background:#eef4f7;color:var(--accent-dark);border:1px solid var(--line);}
  .abtn.ghost:active{background:#e2ecf1;}
  .abtn.wide{grid-column:1 / -1;}
  .abtn:disabled{opacity:.55;cursor:default;}
  .row-mini{grid-column:1 / -1;display:flex;justify-content:center;gap:16px;margin-top:1px;}
  .linkbtn{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;
    font-family:inherit;cursor:pointer;padding:4px 6px;}
  .linkbtn:active{color:var(--accent-dark);}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(15,30,40,.62);
    padding:16px;overflow:auto;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  .modal.show{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
  .modal-card{
    background:#fff;border-radius:16px;max-width:520px;width:100%;
    margin-top:8px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .modal-card h3{margin:2px 0 4px;font-size:15px;}
  .modal-card .hint{margin:0 0 10px;font-size:12px;color:var(--muted);}
  .modal-card img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block;}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .modal-actions .abtn{height:44px;}

  /* loading */
  .busy{
    position:fixed;inset:0;z-index:70;display:none;
    align-items:center;justify-content:center;
    background:rgba(238,241,243,.7);
  }
  .busy.show{display:flex;}
  .spinner{width:38px;height:38px;border-radius:50%;
    border:4px solid #cdd8de;border-top-color:var(--accent);
    animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;}}

  /* export mode: hide placeholders & scrollbars */
  .sheet.exporting .field:empty:before{content:none;}
  .sheet.exporting #body{overflow:hidden;}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* translate group */
  .tbtn.lang{font-weight:700;}
  .tbtn.lang.hi{color:var(--accent-dark);border-color:#bcd6e2;background:#f2f8fb;}
  /* busy text */
  .busybox{display:flex;flex-direction:column;align-items:center;gap:12px;}
  #busyText{font-size:13px;font-weight:700;color:var(--accent-dark);}
  /* toast */
  .toast{
    position:fixed;left:50%;bottom:82px;
    transform:translateX(-50%) translateY(18px);
    background:#15303c;color:#fff;padding:11px 15px;border-radius:12px;
    font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.32);
    display:flex;align-items:center;gap:14px;max-width:92%;z-index:65;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .toast button{background:none;border:none;color:#7fd4ff;font-weight:700;font-size:13px;
    cursor:pointer;font-family:inherit;padding:2px 4px;white-space:nowrap;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>Letter Maker</h1>
    <p>Max Heights Majestic Resident Welfare Society</p>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="grp">
      <button class="tbtn" data-act="fs-" title="Smaller text">A<small>−</small></button>
      <button class="tbtn" data-act="fs+" title="Larger text">A<small>+</small></button>
    </div>
    <div class="grp">
      <button class="tbtn" data-align="left" title="Left">⯇≡</button>
      <button class="tbtn" data-align="center" title="Center">≡</button>
      <button class="tbtn" data-align="justify" title="Justify">☰</button>
    </div>
    <div class="grp">
      <button class="tbtn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button class="tbtn" data-cmd="italic" title="Italic"><i>I</i></button>
      <button class="tbtn" data-cmd="underline" title="Underline"><u>U</u></button>
    </div>
    <div class="grp">
      <button class="tbtn" id="fontToggle" title="Change font">Serif</button>
    </div>
    <div class="grp">
      <button class="tbtn lang hi" data-tl="hi" title="Convert letter to Hindi">🌐 To Hindi</button>
      <button class="tbtn lang" data-tl="en" title="Convert letter to English">🌐 To English</button>
    </div>
  </div>

  <div class="stage">
    <div class="sheet" id="sheet">
      <div class="field" id="letterNo" contenteditable="true" data-ph="e.g. MHM/2026/07"></div>
      <div class="field" id="dateVal" contenteditable="true" data-ph="Date"></div>
      <div class="field" id="body" contenteditable="true"
           data-ph="Type your letter here…&#10;&#10;Subject: ______&#10;&#10;To,&#10;All Residents&#10;&#10;( write the main body of the letter here )"></div>
    </div>
  </div>

  <div class="overflow-warn" id="overflowWarn">This letter is running past one page. Please reduce the text size (A−) or shorten the content.</div>

  <div class="actions">
    <button class="abtn ghost" id="btnImage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      Save as Image
    </button>
    <button class="abtn primary" id="btnPdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 18h4"/></svg>
      Save as PDF
    </button>
    <button class="abtn primary wide" id="btnShare">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/></svg>
      Share Letter
    </button>
    <div class="row-mini">
      <button class="linkbtn" id="btnClear">✕ New Letter (Clear)</button>
      <button class="linkbtn" id="btnSample">📄 Fill Sample</button>
    </div>
  </div>

  <!-- Preview / save modal -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <h3 id="modalTitle">Your letter is ready</h3>
      <p class="hint">Long-press the image to save it to your gallery, or use the buttons below.</p>
      <img id="modalImg" alt="Your finished letter">
      <div class="modal-actions">
        <button class="abtn ghost" id="modalDownload">Download</button>
        <button class="abtn primary" id="modalShare">Share</button>
        <button class="abtn ghost wide" id="modalClose" style="grid-column:1/-1">Close</button>
      </div>
    </div>
  </div>

  <div class="busy" id="busy"><div class="busybox"><div class="spinner"></div><div id="busyText"></div></div></div>
  <div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";
  var $ = function(s){return document.querySelector(s);};
  var sheet=$("#sheet"), body=$("#body"), letterNo=$("#letterNo"), dateVal=$("#dateVal");
  var busy=$("#busy"), overflowWarn=$("#overflowWarn");
  var lastBlob=null, lastURL=null;

  /* ---- Prefill today's date (dd/mm/yyyy) ---- */
  (function(){
    var d=new Date();
    var p=function(n){return String(n).padStart(2,"0");};
    dateVal.textContent = p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();
  })();

  /* ---- Single-line fields: block Enter ---- */
  [letterNo,dateVal].forEach(function(el){
    el.addEventListener("keydown",function(e){ if(e.key==="Enter"){e.preventDefault();} });
  });

  /* ---- Toolbar ---- */
  var FS_MIN=1.7, FS_MAX=3.5, fs=2.35;
  function applyFs(){ document.documentElement.style.setProperty("--body-fs", fs.toFixed(2)+"cqw"); checkOverflow(); saveDraft(); }
  var align="left";
  function setAlign(a){
    align=a; body.style.textAlign=a;
    document.querySelectorAll("[data-align]").forEach(function(b){ b.classList.toggle("on", b.dataset.align===a); });
    saveDraft();
  }
  setAlign("left");

  $("#toolbar").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.act==="fs-"){ fs=Math.max(FS_MIN, fs-0.15); applyFs(); }
    else if(b.dataset.act==="fs+"){ fs=Math.min(FS_MAX, fs+0.15); applyFs(); }
    else if(b.dataset.align){ setAlign(b.dataset.align); }
    else if(b.dataset.cmd){ body.focus(); try{document.execCommand(b.dataset.cmd,false,null);}catch(_){} saveDraft(); }
    else if(b.dataset.tl){ doTranslate(b.dataset.tl); }
  });

  $("#fontToggle").addEventListener("click",function(){
    var on=sheet.classList.toggle("serif");
    this.textContent = on ? "Sans" : "Serif";
    checkOverflow(); saveDraft();
  });

  /* ---- Overflow detection ---- */
  function checkOverflow(){
    // small delay to let layout settle
    requestAnimationFrame(function(){
      var over = body.scrollHeight > body.clientHeight + 2;
      overflowWarn.classList.toggle("show", over);
    });
  }
  body.addEventListener("input", function(){ checkOverflow(); saveDraft(); });
  window.addEventListener("resize", checkOverflow);

  /* ---- Draft autosave (optional, degrades gracefully) ---- */
  function collect(){
    return { ln:letterNo.innerHTML, dt:dateVal.innerHTML, bd:body.innerHTML,
             fs:fs, align:align, serif:sheet.classList.contains("serif") };
  }
  var saveTimer=null;
  function saveDraft(){
    if(typeof window.storage==="undefined"||!window.storage) return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      try{ window.storage.set("mhm_letter_draft", JSON.stringify(collect()), false).catch(function(){}); }catch(_){}
    },500);
  }
  function loadDraft(){
    if(typeof window.storage==="undefined"||!window.storage) return;
    try{
      window.storage.get("mhm_letter_draft").then(function(r){
        if(!r||!r.value) return;
        var d=JSON.parse(r.value);
        if(d.ln) letterNo.innerHTML=d.ln;
        if(typeof d.dt==="string" && d.dt) dateVal.innerHTML=d.dt;
        if(d.bd) body.innerHTML=d.bd;
        if(d.fs){ fs=d.fs; applyFs(); }
        if(d.align){ setAlign(d.align); }
        if(d.serif){ sheet.classList.add("serif"); $("#fontToggle").textContent="Sans"; }
        checkOverflow();
      }).catch(function(){});
    }catch(_){}
  }
  loadDraft();

  /* ---- Clear / Sample ---- */
  $("#btnClear").addEventListener("click",function(){
    if(!confirm("Clear the whole letter and start a new one?")) return;
    letterNo.innerHTML=""; body.innerHTML="";
    var d=new Date(),p=function(n){return String(n).padStart(2,"0");};
    dateVal.textContent=p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();
    checkOverflow(); saveDraft();
  });

  $("#btnSample").addEventListener("click",function(){
    letterNo.textContent="MHM/2026/07";
    body.innerHTML=
      '<p style="text-align:center"><b>Subject: Notice for the Monthly Society Meeting</b></p>'+
      '<p>To,<br>All Esteemed Residents,<br>Max Heights Majestic Township.</p>'+
      '<p>This is to kindly inform you that the monthly general meeting of the society will be held this coming Sunday at 6:00 PM in the society office. Matters relating to parking arrangements, security and maintenance will be discussed.</p>'+
      '<p>All residents are requested to attend on time and share their valuable suggestions.</p>'+
      '<p style="text-align:right">Yours sincerely,<br>Secretary<br>Max Heights Majestic RWS</p>';
    checkOverflow(); saveDraft();
  });

  /* ---- Library readiness ---- */
  function ensureLibs(need){
    return new Promise(function(resolve,reject){
      var tries=0;
      (function poll(){
        var ok = (!need.h2c || window.html2canvas) && (!need.pdf || (window.jspdf&&window.jspdf.jsPDF));
        if(ok) return resolve();
        if(++tries>60) return reject(new Error("libs"));
        setTimeout(poll,150);
      })();
    });
  }

  /* ---- Render sheet to canvas ---- */
  function renderCanvas(){
    var rect=sheet.getBoundingClientRect();
    var targetW=1600;
    var scale=Math.min(4, Math.max(2, targetW/rect.width));
    sheet.classList.add("exporting");
    return html2canvas(sheet,{
      scale:scale, backgroundColor:"#ffffff",
      useCORS:true, allowTaint:true, logging:false,
      width:sheet.offsetWidth, height:sheet.offsetHeight,
      windowWidth:document.documentElement.clientWidth
    }).then(function(canvas){
      sheet.classList.remove("exporting");
      return canvas;
    }).catch(function(e){
      sheet.classList.remove("exporting"); throw e;
    });
  }
  function canvasToBlob(canvas,type,q){
    return new Promise(function(res){ canvas.toBlob(function(b){res(b);}, type, q); });
  }

  function fileStamp(){
    var ln=(letterNo.textContent||"").trim().replace(/[^\w\-]+/g,"_");
    return "MHM_Letter"+(ln?"_"+ln:"")+"_"+Date.now();
  }

  function showBusy(v, text){
    busy.classList.toggle("show", v);
    var t=document.getElementById("busyText");
    if(t){ t.textContent = v ? (text||"") : ""; }
  }

  /* ---- Toast notifications ---- */
  var toastEl=document.getElementById("toast"), toastTimer=null;
  function toast(msg, actLabel, actFn, ms){
    toastEl.innerHTML="";
    var span=document.createElement("span"); span.textContent=msg; toastEl.appendChild(span);
    if(actLabel && actFn){
      var b=document.createElement("button"); b.textContent=actLabel;
      b.addEventListener("click",function(){ actFn(); hideToast(); });
      toastEl.appendChild(b);
    }
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(hideToast, ms || (actLabel?6500:3000));
  }
  function hideToast(){ toastEl.classList.remove("show"); }

  /* ---- English ⇄ Hindi translation ---- */
  function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function decodeEntities(s){
    return (s||"").replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,"&")
                  .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ");
  }

  // Break the letter body into blocks (paragraphs) so structure & alignment are preserved.
  function getBlocks(){
    var out=[], cur=null;
    function pushCur(){ if(cur!==null){ out.push({align:"", lines:cur.split("\n")}); cur=null; } }
    Array.prototype.forEach.call(body.childNodes,function(n){
      if(n.nodeType===3){ cur=(cur||"")+n.nodeValue; }
      else if(n.nodeType===1){
        var tag=n.tagName.toLowerCase();
        if(tag==="br"){ cur=(cur||"")+"\n"; }
        else if(tag==="p"||tag==="div"){
          pushCur();
          var align=(n.style&&n.style.textAlign)?n.style.textAlign:"";
          out.push({align:align, lines:(n.innerText||"").split("\n")});
        } else { cur=(cur||"")+(n.innerText||n.textContent||""); }
      }
    });
    pushCur();
    if(!out.length){ out.push({align:"", lines:[""]}); }
    return out;
  }

  // Translate a single line: try Google endpoint, then MyMemory as fallback.
  function translateLine(text, tl, mmSrc){
    text=text||"";
    if(!text.trim()) return Promise.resolve(text);
    var g="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+
          tl+"&dt=t&q="+encodeURIComponent(text);
    return fetch(g).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){
        if(j && j[0]){ return j[0].map(function(seg){return seg[0];}).join(""); }
        throw 0;
      })
      .catch(function(){
        var m="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+
              "&langpair="+mmSrc+"|"+tl;
        return fetch(m).then(function(r){ if(!r.ok) throw 0; return r.json(); })
          .then(function(j){
            if(j && j.responseData && j.responseData.translatedText){
              return decodeEntities(j.responseData.translatedText);
            }
            throw 0;
          });
      });
  }

  var lastPreTranslate=null;
  function undoTranslate(){
    if(lastPreTranslate==null) return;
    body.innerHTML=lastPreTranslate; lastPreTranslate=null;
    checkOverflow(); saveDraft();
    toast("Reverted.");
  }

  function doTranslate(tl){
    var mmSrc = (tl==="hi") ? "en" : "hi";
    var blocks=getBlocks();
    var jobs=[];
    blocks.forEach(function(bl,bi){ bl.lines.forEach(function(ln,li){ if(ln.trim()) jobs.push([bi,li]); }); });
    if(!jobs.length){ toast("Nothing to translate — type some text first."); return; }
    if(jobs.length>60){ toast("Letter is too long to translate at once. Please shorten it."); return; }

    showBusy(true, "Translating… 0/"+jobs.length);
    var idx=0;
    function step(){
      if(idx>=jobs.length){ return apply(); }
      var j=jobs[idx];
      var src=blocks[j[0]].lines[j[1]];
      return translateLine(src, tl, mmSrc).then(function(out){
        blocks[j[0]].lines[j[1]]=out;
        idx++;
        showBusy(true, "Translating… "+idx+"/"+jobs.length);
        return step();
      });
    }
    function apply(){
      lastPreTranslate = body.innerHTML;
      var html=blocks.map(function(bl){
        var style = bl.align ? ' style="text-align:'+bl.align+'"' : "";
        var content = bl.lines.map(escapeHtml).join("<br>");
        return "<p"+style+">"+(content||"<br>")+"</p>";
      }).join("");
      body.innerHTML=html;
      showBusy(false);
      checkOverflow(); saveDraft();
      toast(tl==="hi" ? "Converted to Hindi." : "Converted to English.", "Undo", undoTranslate);
    }
    step().catch(function(){
      showBusy(false);
      toast("Couldn't translate — check your internet connection and try again.");
    });
  }

  /* ---- Save as Image ---- */
  $("#btnImage").addEventListener("click",function(){
    showBusy(true);
    ensureLibs({h2c:true})
      .then(renderCanvas)
      .then(function(c){ return canvasToBlob(c,"image/png"); })
      .then(function(blob){ showBusy(false); openResult(blob, fileStamp()+".png", "Image ready"); })
      .catch(function(){ showBusy(false); alert("Could not create the image. Please check your internet and try again."); });
  });

  /* ---- Save as PDF ---- */
  $("#btnPdf").addEventListener("click",function(){
    showBusy(true);
    ensureLibs({h2c:true,pdf:true})
      .then(renderCanvas)
      .then(function(canvas){
        var img=canvas.toDataURL("image/jpeg",0.95);
        var jsPDF=window.jspdf.jsPDF;
        var pdf=new jsPDF({orientation:"portrait",unit:"pt",format:"a4"});
        var pw=pdf.internal.pageSize.getWidth();   // 595.28
        var ph=pdf.internal.pageSize.getHeight();  // 841.89
        var iw=pw, ih=iw*(canvas.height/canvas.width);
        var x=0, y=0;
        if(ih<ph){ y=(ph-ih)/2; } else { ih=ph; iw=ih*(canvas.width/canvas.height); x=(pw-iw)/2; }
        pdf.addImage(img,"JPEG",x,y,iw,ih);
        var name=fileStamp()+".pdf";
        // Try share sheet with the PDF file first on mobile
        try{
          var blob=pdf.output("blob");
          var f=new File([blob],name,{type:"application/pdf"});
          if(navigator.canShare && navigator.canShare({files:[f]})){
            showBusy(false);
            navigator.share({files:[f],title:"Letter (PDF)"}).catch(function(){ pdf.save(name); });
            return;
          }
        }catch(_){}
        pdf.save(name);
        showBusy(false);
      })
      .catch(function(){ showBusy(false); alert("Could not create the PDF. Please check your internet and try again."); });
  });

  /* ---- Share (image) ---- */
  $("#btnShare").addEventListener("click",function(){
    showBusy(true);
    ensureLibs({h2c:true})
      .then(renderCanvas)
      .then(function(c){ return canvasToBlob(c,"image/png"); })
      .then(function(blob){
        showBusy(false);
        var name=fileStamp()+".png";
        var f=new File([blob],name,{type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[f]})){
          navigator.share({files:[f],title:"Letter",text:"Max Heights Majestic RWS"})
            .catch(function(){ openResult(blob,name,"Ready to share"); });
        }else{
          openResult(blob,name,"Share / Save");
        }
      })
      .catch(function(){ showBusy(false); alert("Could not share. Please check your internet and try again."); });
  });

  /* ---- Result modal ---- */
  var modal=$("#modal"), modalImg=$("#modalImg"), modalTitle=$("#modalTitle");
  function openResult(blob,name,title){
    if(lastURL){ URL.revokeObjectURL(lastURL); }
    lastBlob=blob; lastURL=URL.createObjectURL(blob);
    modalImg.src=lastURL; modalTitle.textContent=title||"Your letter";
    modal.dataset.name=name;
    modal.classList.add("show");
  }
  $("#modalClose").addEventListener("click",function(){ modal.classList.remove("show"); });
  modal.addEventListener("click",function(e){ if(e.target===modal) modal.classList.remove("show"); });
  $("#modalDownload").addEventListener("click",function(){
    if(!lastBlob) return;
    var a=document.createElement("a");
    a.href=lastURL; a.download=modal.dataset.name||"letter.png";
    document.body.appendChild(a); a.click(); a.remove();
  });
  $("#modalShare").addEventListener("click",function(){
    if(!lastBlob) return;
    var f=new File([lastBlob], modal.dataset.name||"letter.png", {type:lastBlob.type});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:"Letter"}).catch(function(){});
    }else{
      alert("Direct sharing is not available on this device — long-press the image to save it, or tap Download.");
    }
  });

  checkOverflow();
})();
</script>
</body>
</html>
