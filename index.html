<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>पत्र मेकर — Max Heights Majestic RWS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --ink: #15303c;
    --accent: #2c6f90;
    --accent-dark: #1b4c66;
    --desk: #d6dce1;
    --panel: #ffffff;
    --app-bg: #eef1f3;
    --muted: #6a7a83;
    --line: #dbe2e7;
    --body-fs: 14px;
    --lbl-fs: 12px;
    --body-font: "Noto Sans Devanagari", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body {
    background: var(--app-bg);
    color: var(--ink);
    font-family: var(--body-font);
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }

  /* ---------- Login Screen ---------- */
  #loginScreen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--app-bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #fff; padding: 30px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    width: 100%; max-width: 360px; text-align: center;
  }
  .login-card h2 { color: var(--accent); margin: 0 0 5px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .input-group { margin-bottom: 15px; text-align: left; }
  .input-group label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
  .input-group input { 
    width: 100%; padding: 10px; border: 1px solid var(--line); 
    border-radius: 6px; font-size: 14px; outline: none;
  }
  .input-group input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; background: var(--accent); color: #fff;
    padding: 12px; border: none; border-radius: 6px;
    font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .login-btn:active { background: var(--accent-dark); }
  .error-msg { color: #d9534f; font-size: 12px; margin-top: 10px; display: none; }

  /* ---------- App Download Popup ---------- */
  #appBanner {
    display: none; background: #fff; padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    align-items: center; justify-content: space-between;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .app-info { display: flex; align-items: center; gap: 10px; }
  .app-icon { width: 40px; height: 40px; background: var(--accent); border-radius: 8px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
  .app-text h4 { margin: 0; font-size: 14px; }
  .app-text p { margin: 0; font-size: 11px; color: var(--muted); }
  .btn-install { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-close-banner { background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; margin-left: 10px; }

  /* ---------- Main Workspace (Hidden initially) ---------- */
  #mainWorkspace { display: none; flex-direction: column; min-height: 100vh; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    color: #fff; padding: 10px 14px; box-shadow: 0 2px 10px rgba(21,48,60,.18);
  }
  .topbar h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: .2px; }
  .topbar p { margin: 2px 0 0; font-size: 11px; opacity: .85; font-weight: 500; }

  /* ---------- Toolbar & Template Selector ---------- */
  .toolbar {
    position: sticky; top: 56px; z-index: 25;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 8px 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .tools-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
  .tools-row::-webkit-scrollbar { display: none; }
  
  .template-select {
    width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13px; font-family: inherit; color: var(--ink); outline: none;
    background: #f9fbfd; font-weight: 600;
  }

  .grp { display: flex; gap: 4px; align-items: center; flex: 0 0 auto; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); }
  .grp:last-child { border-right: none; }
  .tbtn {
    flex: 0 0 auto; min-width: 34px; height: 34px; padding: 0 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  .tbtn:active { background: #eef4f7; }
  .tbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tbtn small { font-size: 10px; font-weight: 600; }

  /* ---------- Stage & sheet ---------- */
  .stage { background: var(--desk); padding: 14px 10px 20px; display: flex; justify-content: center; flex: 1; }
  .sheet {
    width: 100%; max-width: 600px;
    background: #ffffff;
    box-shadow: 0 8px 26px rgba(21,48,60,.15);
    border-radius: 4px;
    position: relative;
    padding: 40px 30px;
    min-height: 800px;
    border-top: 15px solid var(--accent);
  }
  
  .letterhead-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--accent); padding-bottom: 15px; }
  .letterhead-header h2 { margin: 0; color: var(--accent-dark); font-size: 22px; font-weight: 900; }
  .letterhead-header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  .meta-row { display: flex; justify-content: space-between; margin-bottom: 25px; font-size: var(--lbl-fs); font-weight: bold; }
